[general]
import = ["themes/xterm.toml"]

[terminal]
[terminal.shell]
# Use bin\bash.exe, not git-bash.exe, which opens its own mintty window
program = 'C:\Program Files\Git\bin\bash.exe'
args = ["--login", "-i"]

[env]
# Git Bash's ncurses has no "alacritty" terminfo entry
TERM = "xterm-256color"

[font]
size = 9.0

# Pick and install compatible fonts from https://www.nerdfonts.com/font-downloads
normal = { family = "0xProto Nerd Font Mono", style = "Regular" }
bold   = { family = "0xProto Nerd Font Mono", style = "Bold" }
italic = { family = "0xProto Nerd Font Mono", style = "Italic" }
